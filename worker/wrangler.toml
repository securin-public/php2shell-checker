name = "php2shell-checker"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://securin-public.github.io,http://localhost:8080"

# 10 checks per minute per visitor IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1801"

  [ratelimits.simple]
  limit = 10
  period = 60

# Anonymous per-day verdict counters (no domains or IPs stored).
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

# Workers Logs: keep only our own verdict log lines. Automatic invocation logs are off
# because they would record the request URL, which contains the checked domain.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
