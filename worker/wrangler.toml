name = "php2shell-checker"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://securin-public.github.io,http://localhost:8080"

# 10 checks per minute per visitor IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1801"

  [ratelimits.simple]
  limit = 10
  period = 60
