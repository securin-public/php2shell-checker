<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Checker Usage · Securin</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    try { const t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/stats.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="./" aria-label="PHP2Shell Checker">
        <img class="logo logo--light" src="assets/securin-logo-light.png" alt="Securin" width="140" height="30">
        <img class="logo logo--dark" src="assets/securin-logo-dark.png" alt="Securin" width="140" height="30">
      </a>
      <span class="topbar__tag">Usage statistics</span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap stats">
    <div class="stats__head">
      <div>
        <h1>Checker usage</h1>
        <p class="muted">Checks run on the PHP2Shell Checker, grouped by result. These are counts only. No domains or IP addresses are stored.</p>
      </div>
      <div class="stats__controls" id="controls" hidden>
        <div class="seg" role="radiogroup" aria-label="Time range">
          <button type="button" data-days="7">7 days</button>
          <button type="button" data-days="30" aria-pressed="true">30 days</button>
          <button type="button" data-days="90">90 days</button>
        </div>
        <button type="button" class="linkbtn" id="signOut">Sign out</button>
      </div>
    </div>

    <form class="card keyform" id="keyForm" hidden>
      <label for="key"><strong>Access key</strong></label>
      <p class="muted small">Enter the stats key to view usage.</p>
      <div class="check">
        <input id="key" type="password" autocomplete="current-password" placeholder="Stats access key" required>
        <button class="btn" type="submit"><span class="btn__label">View stats</span><span class="spinner" aria-hidden="true"></span></button>
      </div>
      <p class="keyform__err" id="keyErr" role="alert"></p>
    </form>

    <div id="content" hidden>
      <section class="tiles" id="tiles" aria-label="Totals"></section>

      <section class="card chartcard">
        <div class="chartcard__head">
          <h2>Checks per day</h2>
          <ul class="legend" id="legend"></ul>
        </div>
        <div class="chart" id="chart" role="img"></div>
        <div class="tip" id="tip" hidden></div>
        <details class="tableview">
          <summary>Show as table</summary>
          <div class="tablewrap"><table class="vtable" id="table"></table></div>
        </details>
      </section>
      <p class="muted small" id="updated"></p>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span>© 2026 Securin Inc. All Rights Reserved.</span>
      <span class="footer__links"><a href="./">PHP2Shell Checker</a></span>
    </div>
  </footer>

  <script type="module" src="js/stats.js"></script>
</body>
</html>
