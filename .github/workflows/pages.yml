name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the page at the checker Worker
        env:
          CHECKER_API_URL: ${{ vars.CHECKER_API_URL }}
        run: |
          if [ -n "$CHECKER_API_URL" ]; then
            printf 'export const API_BASE = %s;\n' "\"${CHECKER_API_URL%/}\"" > docs/js/config.js
          else
            echo "::warning::CHECKER_API_URL repository variable is not set; the page will show 'Checker not configured'."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
